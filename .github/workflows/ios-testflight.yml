name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    name: Compiler et envoyer sur TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Vérifier les secrets
        run: |
          test -n "$APP_STORE_CONNECT_KEY_ID" || { echo "Secret APP_STORE_CONNECT_KEY_ID manquant"; exit 1; }
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo "Secret APP_STORE_CONNECT_ISSUER_ID manquant"; exit 1; }
          test -n "$APP_STORE_CONNECT_API_KEY" || { echo "Secret APP_STORE_CONNECT_API_KEY manquant"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer et compiler le site
        working-directory: app
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app/ios

      - name: Archiver et envoyer sur TestFlight
        timeout-minutes: 40
        working-directory: app/ios
        run: bundle exec fastlane ios beta
