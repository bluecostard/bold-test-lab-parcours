<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071c2d">
  <title>Contact — Gemelo</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/legal/legal.css">
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/"><img src="/site/assets/logo.png" alt="Gemelo"></a>
      <nav aria-label="Pages légales">
        <a href="/confidentialite/">Confidentialité</a>
        <a href="/cgu/">CGU</a>
        <a href="/cgv/">CGV</a>
        <a href="/mentions/">Mentions</a>
        <a href="/contact/" aria-current="page">Contact</a>
      </nav>
    </header>
    <main>
      <h1>Contact</h1>
      <p>Une question, un signalement ou une demande concernant votre compte : écrivez-nous. Nous lisons les messages envoyés depuis cette page.</p>
      <form id="contact-form" class="legal-form">
        <label class="sr">Site web <input name="website" tabindex="-1" autocomplete="off"></label>
        <label class="field">Nom <input name="name" required maxlength="80"></label>
        <label class="field">E-mail <input name="email" type="email" required maxlength="254"></label>
        <label class="field">Message <textarea name="message" rows="6" required maxlength="2000"></textarea></label>
        <button class="send" type="submit">Envoyer</button>
        <p id="contact-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <footer>Gemelo · gemelo.online</footer>
  </div>
  <script>
    document.getElementById("contact-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      var form = event.currentTarget;
      var status = document.getElementById("contact-status");
      var button = form.querySelector("button");
      status.textContent = "";
      button.disabled = true;
      button.textContent = "Envoi…";
      try {
        var response = await fetch("/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: form.name.value.trim(),
            email: form.email.value.trim(),
            message: form.message.value.trim(),
            website: form.website.value
          })
        });
        var payload = await response.json().catch(function () { return {}; });
        if (!response.ok) throw new Error(payload.error || "Envoi impossible.");
        status.textContent = "Message envoyé.";
        form.reset();
      } catch (error) {
        status.textContent = error.message || "Envoi impossible pour le moment.";
      } finally {
        button.disabled = false;
        button.textContent = "Envoyer";
      }
    });
  </script>
</body>
</html>
